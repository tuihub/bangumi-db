name: Publish SQLite catalog
on: workflow_dispatch
permissions:
  contents: write
concurrency: sqlite-publication
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Convert upstream dump
        run: sh sqlite/initdb.sh bangumi.sqlite
      - name: Publish compressed database and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gzip -n bangumi.sqlite
          sha256sum bangumi.sqlite.gz > bangumi.sqlite.gz.sha256
          if ! gh release view sqlite >/dev/null 2>&1; then
            gh release create sqlite --title "SQLite catalog" --notes "Current public catalog from https://github.com/bangumi/Archive."
          fi
          gh release upload sqlite bangumi.sqlite.gz bangumi.sqlite.gz.sha256 --clobber
