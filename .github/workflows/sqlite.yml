name: Publish SQLite catalog
on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 0" # Runs every Monday at 07:30 China Standard Time.
permissions:
  contents: write
concurrency: sqlite-publication
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SQLite database
        run: sh sqlite/initdb.sh bangumi.sqlite "$RUNNER_TEMP/bangumi-source.json"
      - name: Publish ZIP archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive_name=$(jq -er '.name | select(type == "string" and endswith(".zip") and (contains("/") | not))' "$RUNNER_TEMP/bangumi-source.json")
          zip -q -6 "./$archive_name" bangumi.sqlite
          sha256sum -- "$archive_name" > "$archive_name.sha256"
          if ! gh release view sqlite >/dev/null 2>&1; then
            gh release create sqlite --title "SQLite catalog" --notes "Prebuilt SQLite databases from [Bangumi Archive dumps](https://github.com/bangumi/Archive)."
          fi
          gh release upload sqlite "./$archive_name" "./$archive_name.sha256" --clobber
